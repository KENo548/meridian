services:
  - type: web
    name: meridian-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
    disk:
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
